name: Portfolio checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm verify:mdx
      - run: pnpm build
      - name: Browser smoke
        shell: bash
        run: |
          pnpm start &
          for suite in verify:browser verify:presentations; do
            if ! PORTFOLIO_BASE_URL=http://127.0.0.1:32800 pnpm "$suite" 2>&1 | tee "$RUNNER_TEMP/portfolio-browser.log"; then
              node -e 'const fs=require("fs"); const log=fs.readFileSync(process.env.RUNNER_TEMP+"/portfolio-browser.log","utf8").split("\n").slice(-30).join("\n"); console.log("::error title=Portfolio browser failure::"+log.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"));'
              exit 1
            fi
          done
